# Serves the built site (dist/) inside the container. TLS, compression and the
# security headers are added by the reverse proxy in front of it.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No access log here: container output is shipped to a log service, and
    # visitor IP addresses must not go there. The proxy in front keeps its own.
    access_log off;
    server_tokens off;
    # Behind a proxy: never build a redirect from this server's own port.
    absolute_redirect off;

    # Health check, also reports the running commit (written at build time).
    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Vite puts a content hash in every file name under /assets/, so these can
    # be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app has no client-side routes, so an unknown path is a real 404 and
    # there is no fallback to index.html. index.html itself is revalidated on
    # every visit, so a deploy shows up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
